name: Test

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile --ignore-scripts

      - run: bun run check

      - run: bun run typecheck

      - run: bun run test
